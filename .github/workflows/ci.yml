name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    # DATABASE_URL só pra satisfazer o postinstall (`prisma generate`, que
    # hoje exige a env mesmo sem conectar — corrige de vez na etapa 12.6);
    # não precisa de um Postgres de verdade pra isso.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend deps
        run: npm --prefix backend ci
      - name: Lint
        run: npm --prefix backend run lint
      - name: Type-check
        run: npx --prefix backend tsc --noEmit
      - name: Unit tests
        run: npm --prefix backend test

  backend-e2e:
    runs-on: ubuntu-latest
    needs: backend-checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alicerce
          POSTGRES_PASSWORD: alicerce
          POSTGRES_DB: alicerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alicerce:alicerce@localhost:5432/alicerce
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend deps
        run: npm --prefix backend ci
      - name: Apply migrations
        run: npm --prefix backend exec -- prisma migrate deploy
      - name: Run e2e tests
        run: npm --prefix backend run test:e2e

  frontend-checks:
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Type-check
        run: npx --prefix frontend tsc --noEmit
      - name: Unit tests
        run: npm --prefix frontend test
      - name: Build
        run: npm --prefix frontend run build

  backend-e2e-db:
    runs-on: ubuntu-latest
    needs: backend-checks
    # Etapa 12.1 (ADR 0013) — a rede real: Postgres + Redis de verdade,
    # RLS/transação/cache exercitados (ao contrário de backend-e2e acima,
    # que usa MockPrisma). A migration add_app_runtime_role já cria a role
    # app_runtime num Postgres fresco como este — nenhum SQL extra aqui.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alicerce
          POSTGRES_PASSWORD: alicerce
          POSTGRES_DB: alicerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alicerce:alicerce@localhost:5432/alicerce
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/alicerce
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      PLATFORM_JWT_SECRET: ci-only-platform-secret
      COOKIE_SECRET: ci-only-cookie-secret
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend deps
        run: npm --prefix backend ci
      - name: Run test:e2e:db
        run: npm --prefix backend run test:e2e:db

  frontend-smoke:
    runs-on: ubuntu-latest
    needs: backend-checks
    # Sobe backend real + frontend de produção, pra ver o que curl/Vitest
    # não enxergam: CSP e erro de Server→Client (etapa 12.1, ADR 0013).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alicerce
          POSTGRES_PASSWORD: alicerce
          POSTGRES_DB: alicerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alicerce:alicerce@localhost:5432/alicerce
      APP_DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/alicerce
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      PLATFORM_JWT_SECRET: ci-only-platform-secret
      COOKIE_SECRET: ci-only-cookie-secret
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      INTERNAL_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend deps
        run: npm --prefix backend ci
      - name: Apply migrations
        run: npm --prefix backend exec -- prisma migrate deploy
      - name: Sync permission catalog
        run: npm --prefix backend run sync:permissions
      - name: Start backend
        run: npm --prefix backend run build && (node backend/dist/src/main & )
      - name: Wait for backend
        run: npx wait-on http://localhost:5000/api/health -t 60000
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm --prefix frontend run test:smoke
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend deps
        run: npm --prefix backend ci
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Audit backend
        run: npm --prefix backend audit --audit-level=high
        continue-on-error: true
      - name: Audit frontend
        run: npm --prefix frontend audit --audit-level=high
        continue-on-error: true

  export-openapi:
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install backend deps
        run: npm --prefix backend ci
      - name: Export OpenAPI
        run: npm --prefix backend run export:openapi
        continue-on-error: true
      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: backend/openapi.json
